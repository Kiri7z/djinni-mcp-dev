name: Verify and publish package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.13.7 twine==7.0.0
      - run: uv build --no-sources
      - name: Inspect distribution contents and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir -p local/release
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_dist.py dist --tag "$RELEASE_TAG" > local/release/artifact-manifest.json
          else
            python scripts/check_dist.py dist > local/release/artifact-manifest.json
          fi
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-manifest
          path: local/release/artifact-manifest.json
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist
      - run: python -m pip install uv==0.13.7
      - name: Install and test the wheel, not an editable checkout
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -m unittest discover -s tests -v
          python tests/package_smoke.py -- uvx --python "$(python -c 'import sys; print(sys.executable)')" --from "$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')" djinni-mcp
      - name: Check source archive installation through uvx
        run: |
          uvx --python "$(python -c 'import sys; print(sys.executable)')" --from "$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.tar.gz")).resolve())')" djinni-mcp --version

  publish:
    if: github.ref_type == 'tag' && github.repository == 'Kiri7z/djinni-mcp-dev'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/djinni-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          skip-existing: false
